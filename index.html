<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Playlist</title>
<meta name="description" content="Listen to my playlist live">
<meta property="og:title" content="My Playlist">
<meta property="og:description" content="Open the link and start listening 🎧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(255, 255, 255, 0.10);
    --glass-strong: rgba(255, 255, 255, 0.18);
    --stroke: rgba(255, 255, 255, 0.28);
    --text: #fff;
    --muted: rgba(255, 255, 255, 0.7);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    background: #0b0b12;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* Animated background from the playlist cover */
  .bg {
    position: fixed; inset: -20%;
    background-size: cover; background-position: center;
    filter: blur(80px) saturate(1.6) brightness(0.75);
    transform: scale(1.1);
    animation: drift 28s ease-in-out infinite alternate;
    z-index: -2;
  }
  .blob {
    position: fixed; width: 50vmax; height: 50vmax; border-radius: 50%;
    filter: blur(90px); opacity: .45; z-index: -1;
    animation: float 22s ease-in-out infinite alternate;
  }
  .blob.a { background: #1db954; top: -15vmax; right: -10vmax; }
  .blob.b { background: #7b5cff; bottom: -20vmax; left: -15vmax; animation-delay: -8s; }
  @keyframes drift { to { transform: scale(1.3) rotate(8deg); } }
  @keyframes float { to { transform: translate(8vmax, 6vmax) scale(1.15); } }

  /* Liquid glass card */
  .card {
    position: relative;
    width: 100%; max-width: 480px;
    padding: 22px;
    border-radius: 32px;
    background: linear-gradient(135deg, var(--glass-strong), var(--glass));
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--stroke);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.45),
      inset 0 -1px 0 rgba(255,255,255,.08),
      0 30px 80px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .card::before { /* Glass highlight */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 60% at 80% 0%, rgba(255,255,255,.28), transparent 55%);
  }

  .head { display: flex; align-items: center; gap: 16px; position: relative; }
  .cover {
    width: 92px; height: 92px; border-radius: 20px; flex-shrink: 0;
    object-fit: cover; background: rgba(255,255,255,.1);
    box-shadow: 0 10px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.2);
  }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
  }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #ff3b5c; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  h1 { font-size: 24px; font-weight: 700; margin: 8px 0 2px; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 14px; }

  .actions { display: flex; gap: 10px; margin: 20px 0 16px; position: relative; }
  .btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-weight: 600; font-size: 15px; color: var(--text);
    padding: 13px 16px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: transform .15s, background .2s;
  }
  .btn:hover { background: rgba(255,255,255,.22); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: rgba(29,185,84,.85); border-color: rgba(255,255,255,.35); }
  .btn.primary:hover { background: rgba(29,185,84,1); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }

  .player {
    position: relative; border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.2);
    min-height: 452px;
  }
  .player iframe { display: block; width: 100%; height: 452px; border: 0; }

  .foot { text-align: center; margin-top: 14px; font-size: 12px; color: var(--muted); position: relative; }
  .foot a { color: inherit; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 20px);
    padding: 10px 18px; border-radius: 999px; font-size: 14px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    opacity: 0; transition: .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 420px) {
    .card { padding: 16px; border-radius: 26px; }
    .cover { width: 76px; height: 76px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <main class="card">
    <div class="head">
      <img class="cover" id="cover" alt="">
      <div>
        <span class="live"><i></i> LIVE</span>
        <h1 id="title">My Playlist</h1>
        <p class="sub">Hit play or pick any song from the list</p>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span id="playText">Play</span>
      </button>
      <button class="btn" id="shareBtn">
        <svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>
        Share
      </button>
    </div>

    <div class="player"><div id="embed"></div></div>

    <p class="foot">Log in to <a href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a> in this browser to hear full tracks</p>
  </main>

  <div class="toast" id="toast">Link copied ✓</div>

<script>
  // To change the playlist, put its ID here (the part after /playlist/ in the link)
  const PLAYLIST_ID = "57XLVugqKJUprz75AGw4uV";
  const PLAYLIST_URL = "https://open.spotify.com/playlist/" + PLAYLIST_ID;

  const $ = id => document.getElementById(id);

  // Fetch title and cover automatically (stays in sync with Spotify)
  fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(PLAYLIST_URL))
    .then(r => r.json())
    .then(d => {
      if (d.title) { $("title").textContent = d.title.trim(); document.title = d.title.trim(); }
      if (d.thumbnail_url) {
        $("cover").src = d.thumbnail_url;
        $("bg").style.backgroundImage = `url("${d.thumbnail_url}")`;
      }
    })
    .catch(() => {});

  // Spotify player
  let controller = null, paused = true;
  window.onSpotifyIframeApiReady = IFrameAPI => {
    IFrameAPI.createController($("embed"),
      { uri: "spotify:playlist:" + PLAYLIST_ID, width: "100%", height: 452, theme: "dark" },
      c => {
        controller = c;
        c.addListener("playback_update", e => {
          paused = e.data.isPaused;
          $("playText").textContent = paused ? "Play" : "Pause";
          $("playIcon").innerHTML = paused
            ? '<path d="M8 5v14l11-7z"/>'
            : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
        });
      });
  };

  $("playBtn").onclick = () => controller && controller.togglePlay();

  $("shareBtn").onclick = async () => {
    const url = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: document.title, url }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(url); } catch (e) {}
    const t = $("toast"); t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  };
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
